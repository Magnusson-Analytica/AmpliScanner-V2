<!DOCTYPE html>
<!-- @dsCard group="Type" name="Type · Display" subtitle="Outfit display + H2" viewport="700x220" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Type — Display</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: var(--surface-paper); }
  .wrap { padding: 22px 26px; }
  .meta {
    font-family: var(--font-display); font-size: 10px;
    letter-spacing: var(--ls-eyebrow); text-transform: uppercase;
    color: var(--fg-3); font-weight: 600; margin-bottom: 6px;
  }
  .display-line {
    font-family: var(--font-display);
    font-weight: 600; font-size: 64px; line-height: 1.05;
    letter-spacing: -0.02em; color: var(--fg-1);
    margin: 0 0 14px;
  }
  .h2-line {
    font-family: var(--font-display);
    font-weight: 600; font-size: 36px; line-height: 1.15;
    letter-spacing: -0.02em; color: var(--fg-1);
    margin: 0 0 4px;
  }
  .meta-inline { color: var(--brand-ember); }
</style>
</head>
<body>
<div class="wrap">
  <div class="meta">Outfit · Display 600 · 64/68 · −2%</div>
  <h1 class="display-line">Analytics that earn their keep.</h1>
  <div class="meta">Outfit · H2 600 · 36/42 · −2%</div>
  <h2 class="h2-line">A boutique consultancy <span class="meta-inline">for product teams</span>.</h2>
</div>
</body>
</html>

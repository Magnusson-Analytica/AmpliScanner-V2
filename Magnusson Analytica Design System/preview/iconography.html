<!DOCTYPE html>
<!-- @dsCard group="Brand" name="Iconography · Lucide" subtitle="Lucide stroke-1.5 — substitution flagged" viewport="700x200" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Iconography — Lucide @ 1.5</title>
<link rel="stylesheet" href="../colors_and_type.css">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<style>
  html, body { margin: 0; padding: 0; background: var(--surface-paper); font-family: var(--font-display); }
  .wrap { padding: 22px 26px; }
  .row { display: flex; gap: 22px; align-items: flex-end; flex-wrap: wrap; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 8px; min-width: 64px; }
  .item .nm { font-size: 11px; color: var(--fg-2); }
  .label { font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 600; color: var(--fg-3); margin-bottom: 12px; }
  .stroke-spec { font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: var(--fg-3); margin-top: 14px; }
  i[data-lucide] { color: #1A1A1A; }
  .ember i[data-lucide] { color: #F3734F; }
</style>
</head>
<body>
<div class="wrap">
  <div class="label">Lucide · stroke 1.5 · 24px default</div>
  <div class="row">
    <div class="item"><i data-lucide="bar-chart-3"></i><span class="nm">chart</span></div>
    <div class="item"><i data-lucide="trending-up"></i><span class="nm">growth</span></div>
    <div class="item"><i data-lucide="users"></i><span class="nm">users</span></div>
    <div class="item"><i data-lucide="layers"></i><span class="nm">layers</span></div>
    <div class="item"><i data-lucide="compass"></i><span class="nm">compass</span></div>
    <div class="item ember"><i data-lucide="arrow-right"></i><span class="nm">arrow</span></div>
    <div class="item ember"><i data-lucide="sparkle"></i><span class="nm">accent</span></div>
  </div>
  <div class="stroke-spec">stroke-width: 1.5 · color: currentColor · default 20px inline / 24px nav / 32–48px feature</div>
</div>
<script>
  lucide.createIcons({ attrs: { 'stroke-width': 1.5 } });
</script>
</body>
</html>

<!DOCTYPE html>
<!-- @dsCard group="Spacing" name="Radii" subtitle="Restrained — md (6) for inputs, lg (10) for cards" viewport="700x180" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Radii</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: var(--surface-paper); font-family: var(--font-display); }
  .wrap {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    align-items: end;
    gap: 16px;
    padding: 26px 22px;
  }
  .item { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .box {
    width: 72px; height: 72px;
    background: var(--brand-ink);
    border: 1px solid var(--border-1);
  }
  .nm { font-size: 11px; color: var(--fg-1); font-weight: 600; }
  .px { font-family: ui-monospace, Menlo, monospace; font-size: 10px; color: var(--fg-3); }
</style>
</head>
<body>
<div class="wrap">
  <div class="item"><div class="box" style="border-radius:0"></div><div class="nm">none</div><div class="px">0</div></div>
  <div class="item"><div class="box" style="border-radius:2px"></div><div class="nm">xs</div><div class="px">2</div></div>
  <div class="item"><div class="box" style="border-radius:4px"></div><div class="nm">sm</div><div class="px">4</div></div>
  <div class="item"><div class="box" style="border-radius:6px"></div><div class="nm">md</div><div class="px">6</div></div>
  <div class="item"><div class="box" style="border-radius:10px"></div><div class="nm">lg</div><div class="px">10</div></div>
  <div class="item"><div class="box" style="border-radius:999px"></div><div class="nm">pill</div><div class="px">999</div></div>
</div>
</body>
</html>

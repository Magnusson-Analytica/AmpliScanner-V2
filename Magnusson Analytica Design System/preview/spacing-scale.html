<!DOCTYPE html>
<!-- @dsCard group="Spacing" name="Spacing scale" subtitle="4 px base · sp-1 → sp-24" viewport="700x240" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Spacing scale</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: var(--surface-paper); font-family: var(--font-display); }
  .wrap { padding: 18px 22px; }
  .row {
    display: grid;
    grid-template-columns: 50px 60px 1fr;
    align-items: center;
    gap: 14px;
    margin-bottom: 6px;
    font-size: 12px;
  }
  .name { font-weight: 600; color: var(--fg-1); }
  .num { font-family: ui-monospace, Menlo, monospace; color: var(--fg-3); }
  .bar { height: 16px; background: var(--brand-ember); border-radius: 2px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="row"><span class="name">sp-1</span><span class="num">4 px</span><div class="bar" style="width:4px"></div></div>
  <div class="row"><span class="name">sp-2</span><span class="num">8 px</span><div class="bar" style="width:8px"></div></div>
  <div class="row"><span class="name">sp-3</span><span class="num">12 px</span><div class="bar" style="width:12px"></div></div>
  <div class="row"><span class="name">sp-4</span><span class="num">16 px</span><div class="bar" style="width:16px"></div></div>
  <div class="row"><span class="name">sp-6</span><span class="num">24 px</span><div class="bar" style="width:24px"></div></div>
  <div class="row"><span class="name">sp-8</span><span class="num">32 px</span><div class="bar" style="width:32px"></div></div>
  <div class="row"><span class="name">sp-12</span><span class="num">48 px</span><div class="bar" style="width:48px"></div></div>
  <div class="row"><span class="name">sp-16</span><span class="num">64 px</span><div class="bar" style="width:64px"></div></div>
  <div class="row"><span class="name">sp-24</span><span class="num">96 px</span><div class="bar" style="width:96px"></div></div>
</div>
</body>
</html>
